<!DOCTYPE html>
<html>
<head>
<title>Test browser Notification</title>
<meta name="author" content="Younes Zaidi">
<meta name="description" content="Notification Browser Using JavaScript /">
<meta name="keywords" content="HTML,CSS,XML,JavaScript,Notification">

<script type="text/javascript">

var articles = [
["Test Notification",""],
["Test Notification",""],
["Test Notification",""],
["Test Notification",""],

];


setInterval(function(){ 
var x = Math.floor((Math.random() * 4) + 1);
var title=articles[x][0];
var desc='Great Working !!';
var url=articles[x][1];
notifyBrowser(title,desc,url);
}, 20000);



document.addEventListener('DOMContentLoaded', function () 
{
    
if (Notification.permission !== "granted")
{
Notification.requestPermission();
}

document.querySelector("#notificationButton").addEventListener("click", function(e)
{
var x = Math.floor((Math.random() * 4) + 1);
var title=articles[x][0];
var desc='i can"t add here tag HTML like this <span></span> or <br> or colors';
var url=articles[x][1];
notifyBrowser(title,desc,url);
e.preventDefault();
});

});

function notifyBrowser(title,desc,url) 
{
if (!Notification) {
console.log('Desktop notifications not available in your browser..'); 
return;
}
if (Notification.permission !== "granted")
{
Notification.requestPermission();
}
else {
var notification = new Notification(title, {
icon:'http://www.tullyelite.com/images/images/TEST-logo-red.png',
body: desc,
});

// Remove the notification from Notification Center when clicked.
notification.onclick = function () {
window.open(url);      
};

// Callback function when the notification is closed.
notification.onclose = function () {
console.log('Notification closed');
};

}
}


</script>
